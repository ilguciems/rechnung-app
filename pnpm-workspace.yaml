allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  msw: true
  prisma: true
  sharp: true

# GHSA-g3hv-75wg-m249: eslint pins minimatch ^10.2.6, which stays in the
# vulnerable range. The only API eslint and @eslint/config-array use
# (new Minimatch(...).match()) is unchanged in 11.
overrides:
  minimatch@<11.0.1: ^11.0.1
